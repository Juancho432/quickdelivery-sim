services:
  db:
    image: postgres:15-alpine
    container_name: delivery_db
    restart: always
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - delivery_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery_api
    restart: always
    environment:
      DATABASE_URL: postgresql://delivery_user:delivery_pass@db:5432/delivery_db
      DATA_DIR: /app/datos
    ports:
      - "8000:8000"
    volumes:
      - ./datos:/app/datos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery_network

volumes:
  postgres_data:
    driver: local

networks:
  delivery_network:
    driver: bridge
